[package]
name = "ito"
version = "0.7.0"
edition = "2024"
authors = ["Dennis Frenken", "Scopevisio Devops GmbH"]
description = "A Lua script runner with a small standard library for inspecting and generating config files"
homepage = "https://github.com/denfren/ito"
repository = "https://github.com/denfren/ito"
license = "MIT"
keywords = ["lua", "luau", "config", "yaml", "toml", "hcl"]
categories = ["command-line-utilities"]

[[bin]]
name = "ito"
path = "bin/ito.rs"

[[bin]]
name = "ied"
path = "bin/ied.rs"

[lib]
path = "lib.rs"

[dependencies]
aes.workspace = true
aws-config.workspace = true
aws-sdk-autoscaling.workspace = true
aws-sdk-cloudtrail.workspace = true
aws-sdk-cloudwatch.workspace = true
aws-sdk-ec2.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-types.workspace = true
clap.workspace = true
clap_complete.workspace = true
comfy-table.workspace = true
unicode-width.workspace = true
ctr.workspace = true
dialoguer.workspace = true
futures-util.workspace = true
hmac.workspace = true
indicatif.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
hcl-rs.workspace = true
hex.workspace = true
base64.workspace = true
humantime.workspace = true
ignore.workspace = true
libc.workspace = true
md-5.workspace = true
pbkdf2.workspace = true
rand.workspace = true
sha1.workspace = true
sha2.workspace = true
jiff.workspace = true
minijinja.workspace = true
names.workspace = true
regex.workspace = true
mlua.workspace = true
openssh.workspace = true
semver.workspace = true
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
termimad.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
yamlito.workspace = true
serde.workspace = true
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }

[dev-dependencies]
insta.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
